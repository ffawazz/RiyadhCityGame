name: Android APK

# Builds an installable debug APK of the game on every push (and on demand).
# Download it from the run's "Artifacts" section: Actions tab -> the run -> RiyadhKids-android-apk.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          # the ubuntu runner image already ships the Android SDK (ANDROID_HOME)
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "cmdline-tools;latest" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          ls "$ANDROID_HOME" "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platform-tools" | head -40

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Debug keystore and Godot editor settings
        run: |
          # one fixed debug key for every build, so a new APK can update the one already installed
          cp signing/riyadhkids-debug.keystore "$HOME/debug.keystore"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Import and export APK
        run: |
          mkdir -p build
          godot --headless --path . --import || true
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore" GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          grep -i android "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" || true
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" | head -30
          godot --headless --verbose --path . --export-debug "Android" build/RiyadhKids-debug.apk
          ls -l build

      - uses: actions/upload-artifact@v4
        with:
          name: RiyadhKids-android-apk
          path: build/RiyadhKids-debug.apk
